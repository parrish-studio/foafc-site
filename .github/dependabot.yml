version: 2

# Keeping dependencies current, as opposed to merely knowing they are stale.
#
# The audit workflow tells you something is wrong. This is what actually fixes
# it, and it reaches the transitive packages a lockfile refresh cannot move on
# its own — most of what `pnpm audit` reports here lives three levels down
# inside Astro and Keystatic.
#
# Tuned hard for low noise. This repo is maintained by one person and will be
# handed to a volunteer; a pull request every other day would be abandoned
# within a month, and an abandoned bot is worse than none, because its red
# tick stops meaning anything.

updates:
  - package-ecosystem: npm
    # The workspace root. Dependabot reads pnpm-workspace.yaml from here and
    # covers apps/foafc and packages/* in one go.
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '13:00'
    open-pull-requests-limit: 3
    groups:
      # One PR a week for all the routine movement, rather than nine.
      routine:
        patterns: ['*']
        update-types: [minor, patch]
      # Majors stay separate and individual: they are the ones that need a
      # human to read a changelog.
      majors:
        patterns: ['*']
        update-types: [major]
    ignore:
      # TypeScript 7 is the native-compiler rewrite, and it drops the
      # programmatic API that `astro check` is built on:
      #
      #   "The TypeScript module loaded (found 7.0.2) does not expose the
      #    programmatic API that `astro check` relies on."
      #
      # So `pnpm check` cannot run at all on TS 7 — not a type error to fix,
      # a missing API. Astro tracks it at
      # https://github.com/withastro/roadmap/discussions/1321
      #
      # Without this, Dependabot reopens that PR every week and its red tick
      # becomes background noise. Remove this block once Astro ships support;
      # minor and patch updates are unaffected.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    commit-message:
      prefix: deps
    labels: [dependencies]

  # The workflows above pin action majors. Without this they quietly rot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels: [dependencies]
